  <path d="M 48,25 C 40,25 34,30 34,38 C 34,42 36,45 39,47 C 36,49 34,52 34,56 C 34,64 40,69 48,69 L 48,25 Z" fill="url(#grad)" filter="url(#glow)" opacity="0.9" />
  <path d="M 52,25 C 60,25 66,30 66,38 C 66,42 64,45 61,47 C 64,49 66,52 66,56 C 66,64 60,69 52,69 L 52,25 Z" fill="url(#grad)" filter="url(#glow)" opacity="0.9" />
