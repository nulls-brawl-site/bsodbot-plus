<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a16" />
      <stop offset="50%" stop-color="#0f0f2d" />
      <stop offset="100%" stop-color="#05050f" />
    </linearGradient>

    <!-- Cyan Glow Gradient -->
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <!-- Purple Glow Gradient -->
    <linearGradient id="purple-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f355da" />
      <stop offset="100%" stop-color="#7000ff" />
    </linearGradient>

    <!-- Lightning Gradient -->
    <linearGradient id="lightning-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007f" />
      <stop offset="50%" stop-color="#ff00ff" />
      <stop offset="100%" stop-color="#00ffff" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-purple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" rx="20" fill="url(#bg-grad)" />
  <rect width="796" height="396" x="2" y="2" rx="18" fill="none" stroke="#1e1e3f" stroke-width="2" />

  <!-- Decorative Grid Lines -->
  <path d="M 0,100 L 800,100 M 0,200 L 800,200 M 0,300 L 800,300 M 200,0 L 200,400 M 400,0 L 400,400 M 600,0 L 600,400" stroke="#12122b" stroke-width="1" />

  <!-- Centered Cybernetic Cat / Robot Head Icon -->
  <g transform="translate(280, 20)">
    <!-- Outer Hexagon Shield -->
    <polygon points="120,10 220,60 220,180 120,230 20,180 20,60" fill="none" stroke="url(#cyan-glow)" stroke-width="3" filter="url(#glow-cyan)" />
    
    <!-- Inner Cybernetic Head -->
    <path d="M 60,70 L 120,40 L 180,70 L 180,150 L 120,190 L 60,150 Z" fill="#111126" stroke="url(#purple-glow)" stroke-width="2" />
    
    <!-- Cyber Ears -->
    <polygon points="60,70 40,30 90,55" fill="url(#purple-glow)" opacity="0.8" />
    <polygon points="180,70 200,30 150,55" fill="url(#purple-glow)" opacity="0.8" />

    <!-- Glowing Eyes -->
    <ellipse cx="95" cy="105" rx="15" ry="5" fill="#00f2fe" filter="url(#glow-cyan)" />
    <ellipse cx="145" cy="105" rx="15" ry="5" fill="#00f2fe" filter="url(#glow-cyan)" />
    
    <!-- Cyber Circuits / Lines -->
    <path d="M 120,40 L 120,90 M 120,130 L 120,190 M 60,110 L 80,110 M 160,110 L 180,110" stroke="#7000ff" stroke-width="2" opacity="0.6" />
    
    <!-- Glowing Core / Mouth -->
    <polygon points="110,140 130,140 120,155" fill="#ff007f" filter="url(#glow-purple)" />
  </g>

  <!-- Glowing Lightning Bolt (Centered) -->
  <g transform="translate(410, 40)" filter="url(#glow-purple)">
    <path d="M 40,10 L -10,110 L 25,110 L 5,210 L 75,90 L 30,90 Z" fill="url(#lightning-grad)" />
  </g>

  <!-- Centered Typography (Absolutely immune to horizontal overflow) -->
  <g transform="translate(400, 290)">
    <!-- BSODBOT PLUS -->
    <text text-anchor="middle" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-weight="900" font-size="44" letter-spacing="4">
      <tspan fill="#ffffff">BSODBOT</tspan>
      <tspan fill="url(#lightning-grad)" filter="url(#glow-purple)"> PLUS</tspan>
    </text>
    <!-- Subtitle -->
    <text y="35" text-anchor="middle" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-weight="600" font-size="14" fill="#00f2fe" letter-spacing="4" opacity="0.9" filter="url(#glow-cyan)">
      NEXT-GEN AI AGENT GATEWAY
    </text>
    <!-- Small Tech Badge -->
    <g transform="translate(-70, 50)">
      <rect width="140" height="24" rx="12" fill="#1e1e3f" stroke="#7000ff" stroke-width="1" />
      <text x="70" y="16" text-anchor="middle" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-weight="700" font-size="11" fill="#ff007f" letter-spacing="2">
        v2.0.0-HYBRID
      </text>
    </g>
  </g>
</svg>
