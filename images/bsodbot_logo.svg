<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030208" />
      <stop offset="50%" stop-color="#08071a" />
      <stop offset="100%" stop-color="#020105" />
    </linearGradient>

    <!-- Cyan Glow Gradient -->
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <!-- Purple Glow Gradient -->
    <linearGradient id="purple-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f355da" />
      <stop offset="100%" stop-color="#7000ff" />
    </linearGradient>

    <!-- Lightning Gradient -->
    <linearGradient id="lightning-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007f" />
      <stop offset="50%" stop-color="#d300ff" />
      <stop offset="100%" stop-color="#00ffff" />
    </linearGradient>

    <!-- Circuit Line Gradient -->
    <linearGradient id="circuit-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7000ff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0.2" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glow-cyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur1" />
      <feGaussianBlur stdDeviation="12" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-purple" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur1" />
      <feGaussianBlur stdDeviation="16" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <filter id="glow-soft" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" rx="24" fill="url(#bg-grad)" />
  <rect width="796" height="396" x="2" y="2" rx="22" fill="none" stroke="#161435" stroke-width="2" />

  <!-- Cyber Grid Pattern -->
  <g opacity="0.08">
    <path d="M 0,50 L 800,50 M 0,100 L 800,100 M 0,150 L 800,150 M 0,200 L 800,200 M 0,250 L 800,250 M 0,300 L 800,300 M 0,350 L 800,350" stroke="#00f2fe" stroke-width="1" />
    <path d="M 50,0 L 50,400 M 100,0 L 100,400 M 150,0 L 150,400 M 200,0 L 200,400 M 250,0 L 250,400 M 300,0 L 300,400 M 350,0 L 350,400 M 400,0 L 400,400 M 450,0 L 450,400 M 500,0 L 500,400 M 550,0 L 550,400 M 600,0 L 600,400 M 650,0 L 650,400 M 700,0 L 700,400 M 750,0 L 750,400" stroke="#00f2fe" stroke-width="1" />
    <!-- Diagonal Tech Lines -->
    <path d="M -100,100 L 300,-300 M 100,500 L 900,-300 M 500,500 L 1100,-100" stroke="#7000ff" stroke-width="1" />
  </g>

  <!-- Tech Corner Brackets -->
  <g stroke="#1e1b4b" stroke-width="2" fill="none" opacity="0.6">
    <path d="M 30,60 L 30,30 L 60,30" />
    <path d="M 770,60 L 770,30 L 740,30" />
    <path d="M 30,340 L 30,370 L 60,370" />
    <path d="M 770,340 L 770,370 L 740,370" />
  </g>

  <!-- Background Circuit Traces -->
  <g fill="none" stroke="url(#circuit-grad)" stroke-width="1.5" opacity="0.3">
    <path d="M 50,150 L 120,150 L 150,180 L 150,250" />
    <circle cx="50" cy="150" r="3" fill="#7000ff" />
    <path d="M 750,250 L 680,250 L 650,220 L 650,150" />
    <circle cx="750" cy="250" r="3" fill="#00f2fe" />
    <path d="M 400,30 L 400,70 L 430,100 L 500,100" />
    <circle cx="500" cy="100" r="3" fill="#ff007f" />
  </g>

  <!-- Cybernetic Cat / Robot Head Icon (Shifted Left to 50) -->
  <g transform="translate(50, 80)">
    <!-- Outer Hexagon Shield with Tech Nodes -->
    <polygon points="120,10 220,60 220,180 120,230 20,180 20,60" fill="#080718" fill-opacity="0.6" stroke="url(#cyan-glow)" stroke-width="2.5" filter="url(#glow-cyan)" />
    
    <!-- Hexagon Corner Tech Accents -->
    <circle cx="120" cy="10" r="4" fill="#00f2fe" filter="url(#glow-soft)" />
    <circle cx="220" cy="60" r="4" fill="#00f2fe" filter="url(#glow-soft)" />
    <circle cx="220" cy="180" r="4" fill="#00f2fe" filter="url(#glow-soft)" />
    <circle cx="120" cy="230" r="4" fill="#00f2fe" filter="url(#glow-soft)" />
    <circle cx="20" cy="180" r="4" fill="#00f2fe" filter="url(#glow-soft)" />
    <circle cx="20" cy="60" r="4" fill="#00f2fe" filter="url(#glow-soft)" />

    <!-- Inner Cybernetic Head -->
    <path d="M 60,70 L 120,40 L 180,70 L 180,150 L 120,190 L 60,150 Z" fill="#0d0c22" stroke="url(#purple-glow)" stroke-width="2" />
    
    <!-- Cyber Ears (Multi-segmented) -->
    <polygon points="60,70 40,30 90,55" fill="url(#purple-glow)" opacity="0.8" />
    <polygon points="60,70 48,40 80,58" fill="#111126" />
    
    <polygon points="180,70 200,30 150,55" fill="url(#purple-glow)" opacity="0.8" />
    <polygon points="180,70 192,40 160,58" fill="#111126" />

    <!-- Glowing Eyes with HUD lines -->
    <g filter="url(#glow-cyan)">
      <ellipse cx="95" cy="105" rx="16" ry="6" fill="#00f2fe" />
      <ellipse cx="95" cy="105" rx="8" ry="2" fill="#ffffff" />
      <ellipse cx="145" cy="105" rx="16" ry="6" fill="#00f2fe" />
      <ellipse cx="145" cy="105" rx="8" ry="2" fill="#ffffff" />
      <!-- Eye HUD Crosshairs -->
      <path d="M 75,105 L 115,105 M 125,105 L 165,105" stroke="#00f2fe" stroke-width="0.5" opacity="0.7" />
    </g>
    
    <!-- Cyber Face Circuits / PCB Traces -->
    <g fill="none" stroke="#7000ff" stroke-width="1.5" opacity="0.7">
      <path d="M 120,40 L 120,85" />
      <path d="M 120,135 L 120,190" />
      <path d="M 60,110 L 80,110 L 90,120" />
      <circle cx="90" cy="120" r="2" fill="#7000ff" />
      <path d="M 180,110 L 160,110 L 150,120" />
      <circle cx="150" cy="120" r="2" fill="#7000ff" />
      <!-- Cheek Lines -->
      <path d="M 75,140 L 95,150 L 110,150" />
      <path d="M 165,140 L 145,150 L 130,150" />
    </g>
    
    <!-- Glowing Core / Mouth (Pulse Wave) -->
    <g filter="url(#glow-purple)">
      <polygon points="110,135 130,135 120,150" fill="#ff007f" />
      <path d="M 105,160 Q 120,175 135,160" fill="none" stroke="#ff007f" stroke-width="2" stroke-linecap="round" />
    </g>

    <!-- Sub-orbital Data Nodes -->
    <circle cx="95" cy="85" r="1.5" fill="#00f2fe" />
    <circle cx="145" cy="85" r="1.5" fill="#00f2fe" />
  </g>

  <!-- Glowing Lightning Bolt (Shifted Left to 210) -->
  <g transform="translate(210, 100)" filter="url(#glow-purple)">
    <!-- Outer Shadow/Glow Layer -->
    <path d="M 40,10 L -10,110 L 25,110 L 5,210 L 75,90 L 30,90 Z" fill="#ff007f" opacity="0.3" transform="scale(1.05) translate(-2, -2)" />
    <!-- Main Bolt -->
    <path d="M 40,10 L -10,110 L 25,110 L 5,210 L 75,90 L 30,90 Z" fill="url(#lightning-grad)" />
    <!-- Inner Core Highlight -->
    <path d="M 38,15 L -5,108 L 25,108 L 7,200 L 70,92 L 32,92 Z" fill="#ffffff" opacity="0.6" />
  </g>

  <!-- Typography (Shifted Left to 290, Font Size Optimized to 46 to prevent any overflow) -->
  <g transform="translate(290, 180)">
    <!-- BSODBOT PLUS -->
    <text font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-weight="900" font-size="46" letter-spacing="3">
      <tspan fill="#ffffff" filter="drop-shadow(0px 4px 8px rgba(0,0,0,0.5))">BSODBOT</tspan>
      <tspan fill="url(#lightning-grad)" filter="url(#glow-purple)"> PLUS</tspan>
    </text>
    
    <!-- Subtitle (Font Size Optimized to 14, Letter Spacing to 3) -->
    <text x="5" y="40" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-weight="600" font-size="14" fill="#00f2fe" letter-spacing="3" opacity="0.9" filter="url(#glow-cyan)">
      NEXT-GEN AI AGENT GATEWAY
    </text>
    
    <!-- Decorative HUD Line under subtitle -->
    <path d="M 5,50 L 320,50" stroke="url(#cyan-glow)" stroke-width="1" opacity="0.5" />
    <rect x="315" y="48" width="10" height="4" fill="#00f2fe" filter="url(#glow-cyan)" />

    <!-- Small Tech Badges -->
    <g transform="translate(5, 65)">
      <!-- Version Badge -->
      <rect x="0" y="0" width="110" height="20" rx="10" fill="#11102b" stroke="#7000ff" stroke-width="1" />
      <text x="12" y="14" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-weight="800" font-size="9" fill="#ff007f" letter-spacing="1.5">
        v2.0.0-HYBRID
      </text>

      <!-- Status Badge -->
      <rect x="120" y="0" width="90" height="20" rx="10" fill="#081c1f" stroke="#00f2fe" stroke-width="1" />
      <circle cx="132" cy="10" r="3" fill="#00f2fe" filter="url(#glow-cyan)" />
      <text x="142" y="14" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-weight="800" font-size="9" fill="#00f2fe" letter-spacing="1.5">
        SYS_ACTIVE
      </text>
    </g>
  </g>

  <!-- Decorative HUD Elements on the right side -->
  <g transform="translate(680, 80)" opacity="0.4" fill="none" stroke="#7000ff" stroke-width="1">
    <!-- Tech Circle / Radar -->
    <circle cx="50" cy="50" r="30" stroke-dasharray="5,5" />
    <circle cx="50" cy="50" r="20" stroke="#00f2fe" />
    <circle cx="50" cy="50" r="5" fill="#ff007f" />
    <path d="M 50,10 L 50,90 M 10,50 L 90,50" stroke-dasharray="2,2" />
    <!-- Data Blocks -->
    <rect x="10" y="100" width="15" height="6" fill="#7000ff" />
    <rect x="30" y="100" width="25" height="6" fill="#00f2fe" />
    <rect x="60" y="100" width="10" height="6" fill="#ff007f" />
    <text x="10" y="125" font-family="monospace" font-size="8" fill="#00f2fe">SEC_LEVEL: MAX</text>
  </g>
</svg>
