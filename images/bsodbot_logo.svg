<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05050d" />
      <stop offset="40%" stop-color="#08081a" />
      <stop offset="80%" stop-color="#0c0c28" />
      <stop offset="100%" stop-color="#030308" />
    </linearGradient>

    <!-- Metallic Face Gradients -->
    <linearGradient id="metal-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f1f3d" />
      <stop offset="50%" stop-color="#0f0f24" />
      <stop offset="100%" stop-color="#080815" />
    </linearGradient>

    <linearGradient id="metal-light" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3d3d7a" />
      <stop offset="100%" stop-color="#1a1a3a" />
    </linearGradient>

    <!-- Neon Gradients -->
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#00b8ff" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <linearGradient id="purple-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff007f" />
      <stop offset="50%" stop-color="#b000ff" />
      <stop offset="100%" stop-color="#7000ff" />
    </linearGradient>

    <linearGradient id="lightning-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="20%" stop-color="#ff007f" />
      <stop offset="70%" stop-color="#b000ff" />
      <stop offset="100%" stop-color="#00ffff" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glow-cyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur1" />
      <feGaussianBlur stdDeviation="12" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-purple" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur1" />
      <feGaussianBlur stdDeviation="16" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-soft" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" rx="24" fill="url(#bg-grad)" />
  
  <!-- Outer Cyber Frame -->
  <rect width="794" height="394" x="3" y="3" rx="21" fill="none" stroke="#1a1a3a" stroke-width="1.5" />
  <rect width="786" height="386" x="7" y="7" rx="17" fill="none" stroke="#0d0d21" stroke-width="1" />

  <!-- Cyberpunk Corner Brackets -->
  <path d="M 20,50 L 20,20 L 50,20" fill="none" stroke="#00f2fe" stroke-width="3" stroke-linecap="round" filter="url(#glow-cyan)" />
  <path d="M 780,50 L 780,20 L 750,20" fill="none" stroke="#00f2fe" stroke-width="3" stroke-linecap="round" filter="url(#glow-cyan)" />
  <path d="M 20,350 L 20,380 L 50,380" fill="none" stroke="#00f2fe" stroke-width="3" stroke-linecap="round" filter="url(#glow-cyan)" />
  <path d="M 780,350 L 780,380 L 750,380" fill="none" stroke="#00f2fe" stroke-width="3" stroke-linecap="round" filter="url(#glow-cyan)" />

  <!-- Tech Grid & Crosshairs -->
  <g opacity="0.08">
    <path d="M 0,50 L 800,50 M 0,100 L 800,100 M 0,150 L 800,150 M 0,200 L 800,200 M 0,250 L 800,250 M 0,300 L 800,300 M 0,350 L 800,350" stroke="#ffffff" stroke-width="1" />
    <path d="M 100,0 L 100,400 M 200,0 L 200,400 M 300,0 L 300,400 M 400,0 L 400,400 M 500,0 L 500,400 M 600,0 L 600,400 M 700,0 L 700,400" stroke="#ffffff" stroke-width="1" />
    <!-- Crosshairs -->
    <circle cx="400" cy="200" r="6" fill="none" stroke="#ffffff" stroke-width="1.5" />
    <path d="M 400,190 L 400,210 M 390,200 L 410,200" stroke="#ffffff" stroke-width="1.5" />
  </g>

  <!-- Background Circuit Board Traces (Highly Detailed) -->
  <g stroke="url(#purple-glow)" stroke-width="1.5" fill="none" opacity="0.25">
    <!-- Left Side Circuits -->
    <path d="M 30,120 L 100,120 L 130,150 L 130,220 L 100,250 L 30,250" />
    <circle cx="100" cy="120" r="3" fill="#ff007f" />
    <circle cx="100" cy="250" r="3" fill="#ff007f" />
    <path d="M 80,80 L 140,80 L 170,110 L 170,160" />
    <circle cx="170" cy="160" r="3" fill="#b000ff" />
    
    <!-- Right Side Circuits -->
    <path d="M 770,120 L 700,120 L 670,150 L 670,220 L 700,250 L 770,250" />
    <circle cx="700" cy="120" r="3" fill="#ff007f" />
    <circle cx="700" cy="250" r="3" fill="#ff007f" />
    <path d="M 720,80 L 660,80 L 630,110 L 630,160" />
    <circle cx="630" cy="160" r="3" fill="#b000ff" />
  </g>

  <!-- Status Indicators (Hacker Aesthetic) -->
  <g font-family="monospace" font-size="10" fill="#00f2fe" opacity="0.6" letter-spacing="1">
    <text x="35" y="35">[SYS_STATUS: ACTIVE]</text>
    <text x="35" y="365">[BYPASS_ENGINE: ENABLED]</text>
    <text x="615" y="35">[TLS_FINGERPRINT: JA4]</text>
    <text x="645" y="365">[PORT: 8443/SOCKS5]</text>
  </g>

  <!-- Cybernetic Cat / Robot Head Icon (Shifted Left to 50) -->
  <g transform="translate(50, 80)">
    <!-- Outer Hexagon Shield (Double Layered) -->
    <polygon points="120,5 225,55 225,185 120,235 15,185 15,55" fill="none" stroke="#121230" stroke-width="6" />
    <polygon points="120,10 220,60 220,180 120,230 20,180 20,60" fill="none" stroke="url(#cyan-glow)" stroke-width="2.5" filter="url(#glow-cyan)" />
    <polygon points="120,15 215,63 215,177 120,225 25,177 25,63" fill="none" stroke="#7000ff" stroke-width="1" stroke-dasharray="10, 5" opacity="0.7" />
    
    <!-- Cyber Ears (Detailed Panel Design) -->
    <!-- Left Ear -->
    <polygon points="60,70 35,20 90,55" fill="url(#metal-dark)" stroke="url(#purple-glow)" stroke-width="1.5" />
    <polygon points="55,65 42,32 78,54" fill="url(#purple-glow)" opacity="0.6" />
    <!-- Right Ear -->
    <polygon points="180,70 205,20 150,55" fill="url(#metal-dark)" stroke="url(#purple-glow)" stroke-width="1.5" />
    <polygon points="185,65 198,32 162,54" fill="url(#purple-glow)" opacity="0.6" />

    <!-- Inner Cybernetic Head (Multi-segmented Faceplate) -->
    <path d="M 60,70 L 120,40 L 180,70 L 180,150 L 120,190 L 60,150 Z" fill="url(#metal-dark)" stroke="url(#metal-light)" stroke-width="2" />
    
    <!-- Left Faceplate Segment -->
    <path d="M 65,75 L 115,50 L 115,180 L 65,145 Z" fill="url(#metal-light)" opacity="0.15" />
    <!-- Right Faceplate Segment -->
    <path d="M 175,75 L 125,50 L 125,180 L 175,145 Z" fill="url(#metal-light)" opacity="0.3" />

    <!-- Cyber Circuit Lines on Face -->
    <path d="M 120,40 L 120,85 M 120,135 L 120,190" stroke="#7000ff" stroke-width="2" opacity="0.8" />
    <path d="M 60,110 L 85,110 M 155,110 L 180,110" stroke="#00f2fe" stroke-width="1.5" opacity="0.8" filter="url(#glow-cyan)" />
    <path d="M 85,110 L 100,125 M 155,110 L 140,125" stroke="#00f2fe" stroke-width="1.5" opacity="0.8" />

    <!-- Glowing Eyes (Highly Detailed Cybernetic Design) -->
    <!-- Left Eye -->
    <ellipse cx="95" cy="105" rx="18" ry="6" fill="#051c24" stroke="#00f2fe" stroke-width="1" />
    <ellipse cx="95" cy="105" rx="12" ry="3" fill="#00f2fe" filter="url(#glow-cyan)" />
    <circle cx="95" cy="105" r="2" fill="#ffffff" />
    <!-- Right Eye -->
    <ellipse cx="145" cy="105" rx="18" ry="6" fill="#051c24" stroke="#00f2fe" stroke-width="1" />
    <ellipse cx="145" cy="105" rx="12" ry="3" fill="#00f2fe" filter="url(#glow-cyan)" />
    <circle cx="145" cy="105" r="2" fill="#ffffff" />
    
    <!-- Glowing Core / Mouth (Triangle Energy Port) -->
    <polygon points="110,145 130,145 120,162" fill="#ff007f" filter="url(#glow-purple)" />
    <polygon points="114,147 126,147 120,157" fill="#ffffff" />
  </g>

  <!-- Glowing Lightning Bolt (Shifted Left to 210, Multi-layered Plasma Effect) -->
  <g transform="translate(210, 100)">
    <!-- Outer Purple Plasma Glow -->
    <path d="M 40,10 L -10,110 L 25,110 L 5,210 L 75,90 L 30,90 Z" fill="#ff007f" opacity="0.4" filter="url(#glow-purple)" />
    <!-- Inner Cyan Energy Core -->
    <path d="M 38,15 L -6,108 L 27,108 L 8,202 L 71,93 L 32,93 Z" fill="url(#lightning-grad)" filter="url(#glow-cyan)" />
    <!-- Bright White Center Core -->
    <path d="M 35,25 L 0,105 L 30,105 L 15,190 L 63,97 L 35,97 Z" fill="#ffffff" opacity="0.9" />
    
    <!-- Floating Energy Particles -->
    <circle cx="-15" cy="130" r="2" fill="#ff007f" filter="url(#glow-purple)" />
    <circle cx="85" cy="80" r="3" fill="#00f2fe" filter="url(#glow-cyan)" />
    <circle cx="15" cy="220" r="1.5" fill="#ffffff" />
    <circle cx="5" cy="60" r="2.5" fill="#b000ff" filter="url(#glow-purple)" />
  </g>

  <!-- Typography (Shifted Left to 290, Font Size Optimized to 46 to prevent any overflow) -->
  <g transform="translate(290, 180)">
    <!-- BSODBOT PLUS -->
    <text font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-weight="900" font-size="46" letter-spacing="3">
      <tspan fill="#ffffff" filter="url(#glow-soft)">BSODBOT</tspan>
      <tspan fill="url(#lightning-grad)" filter="url(#glow-purple)"> PLUS</tspan>
    </text>
    
    <!-- Subtitle (Font Size Optimized to 14, Letter Spacing to 3) -->
    <text x="5" y="40" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-weight="600" font-size="14" fill="#00f2fe" letter-spacing="3" opacity="0.9" filter="url(#glow-cyan)">
      NEXT-GEN AI AGENT GATEWAY
    </text>
    
    <!-- Glowing Accent Line under text -->
    <line x1="5" y1="48" x2="360" y2="48" stroke="url(#cyan-glow)" stroke-width="2" filter="url(#glow-cyan)" />
    <line x1="360" y1="48" x2="420" y2="48" stroke="url(#purple-glow)" stroke-width="2" filter="url(#glow-purple)" />

    <!-- Small Tech Badge (Highly Detailed Control Panel Style) -->
    <g transform="translate(5, 62)">
      <rect x="0" y="0" width="150" height="26" rx="6" fill="#090919" stroke="#7000ff" stroke-width="1.5" />
      <rect x="3" y="3" width="144" height="20" rx="4" fill="#111126" />
      <!-- Small blinking red dot -->
      <circle cx="15" cy="13" r="3" fill="#ff007f" filter="url(#glow-purple)" />
      <text x="28" y="17" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-weight="800" font-size="11" fill="#00f2fe" letter-spacing="1.5">
        v2.0.0-HYBRID
      </text>
    </g>
  </g>
</svg>
